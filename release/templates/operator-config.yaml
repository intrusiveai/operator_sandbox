# Install as a private (0600) file in the documented host configuration directory.
# Choose an image already available to the local Docker installation.
engine:
  image: registry.example.com/intrusive/attack_harness:1.2.3

spool:
  max_bytes: 536870912

evidence:
  max_archive_bytes: 4294967296

journal:
  max_bytes: 8589934592
  segment_bytes: 16777216
  minimum_free_bytes: 268435456

# Campaign preparation requires a private profile; select its installed location.
# target:
#   profile_file: /etc/operator/targets/local-interceptor.json

# Optional settings below have OS-specific defaults. See docs/HOST_CONFIGURATION.md.
# docker:
#   endpoint: unix:///var/run/docker.sock
#   executable: /usr/bin/docker
# state:
#   root: /var/lib/operator

# Optional campaign defaults; bundle requests can only narrow them.
# limits:
#   max_attempt_admissions: 100
#   max_active_seconds: 1800
#   max_model_tokens: 250000
#   max_snapshot_admissions: 20
#   max_snapshot_bytes: 1073741824
#   harness:
#     max_model_turns: 300
#     max_tool_calls: 2000

# Global target-profile ceiling; default 120000 ms.
# Set inside the existing target section, alongside profile_file:
#   max_operation_timeout_ms: 120000

# Frozen ordinary-operation waits (milliseconds). Unlisted operations use 30000.
operation_timeouts_ms:
  engine.attempt_execute: 120000
  engine.model_generate: 120000
  engine.snapshot_request: 300000
  engine.restore_request: 300000
# Decoded/canonical byte allowances; the existing wire safety ceilings still apply.
size_limits:
  direct_input_bytes: 32768
  assessment_bytes: 1048576
  artifact_bytes: 16777216
  artifact_part_bytes: 262144
  observation_chunk_bytes: 262144
  snapshot_page_items: 100
