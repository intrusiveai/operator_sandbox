name: publish Operator release catalog
run-name: ${{ inputs.request_id || 'Manual Operator catalog retry' }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID generated by the publishing workflow
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: operator-catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  entry:
    if: github.repository == 'intrusiveai/operator_sandbox' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      json: ${{ steps.entry.outputs.json }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify catalog entry against the tagged release assets
        id: entry
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/publish_host_release.py catalog-context --tag "$RELEASE_TAG" --source "$GITHUB_SHA"
  publish:
    needs: entry
    permissions:
      contents: read
      id-token: write
    uses: intrusiveai-engineering/releases/.github/workflows/publish-catalog.yml@fc4618b56a7862a410558e7824b3f5681e426714
    with:
      product: operator_sandbox
      entry_json: ${{ needs.entry.outputs.json }}
