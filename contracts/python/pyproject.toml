[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operator-contracts"
version = "0.0.0.dev1"
description = "Operator shared-contract validation foundation (unpublished)"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.26.0", "referencing==0.37.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["operator_contracts*"]
